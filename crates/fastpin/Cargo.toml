[package]
name = "fastpin"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "fastpin"
path = "src/lib.rs"

[[bin]]
name = "FastPin"
path = "src/main.rs"

[dependencies]
# 本地翻译目前只有目录 / 下载 / 调度骨架，不引入 ort / tokenizers：仓库里没有
# 模型与 tokenizer，运行时也会明确报「推理管线尚未实现」并回退到 API。
gpui-kit = { version = "=0.8.0", default-features = false, features = ["component", "assets"] }
gpui-component = { version = "=0.8.0", default-features = false }
raw-window-handle = "0.6"
image = "0.25"
# Vendored from snow-shot (GPL-3.0-or-later): ORB feature-based image stitching.
# See NOTICE and LICENSE-GPL-3.0 at the workspace root.
snow-stitch-images = { path = "../snow-stitch-images", default-features = false }
oar-ocr = "0.9"
printpdf = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.2"
chrono = "0.4"
# The `#[implement]` macro emits `::windows_core::` paths, so the crate must be
# nameable at the crate root even though it is re-exported as `windows::core`.
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Credentials",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Animation",
] }

[build-dependencies]
winres = "0.1"
