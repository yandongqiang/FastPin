name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      # 与 ci.yml 同款质量门禁：打 tag 前先过 fmt/clippy/test，不让坏代码发布。
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      # The exe looks for models\v6 next to itself, so both packages have to carry
      # them: without this the OCR button is dead on a fresh machine (translate
      # uses a user-supplied API and reads no models).
      # DirectML.dll is the OCR GPU backend; ship it too.
      - name: Stage zip
        run: |
          $ver = "${{ github.ref_name }}" -replace '^[vV]+',''
          "APP_VERSION=$ver" >> $env:GITHUB_ENV
          $dir = "dist/FastPin-v$ver"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/FastPin.exe $dir
          Copy-Item target/release/DirectML.dll $dir
          Copy-Item LICENSE $dir
          Copy-Item NOTICE $dir
          Copy-Item COPYRIGHT.snow-shot $dir
          # GPLv3 §6 source offer / build instructions and Apache-2.0 text for
          # the vendored GPUI code (the README's attribution list has the rest).
          Copy-Item README.md $dir
          Copy-Item third_party/gpui/LICENSE-APACHE $dir
          New-Item -ItemType Directory -Force "$dir/models/v6" | Out-Null
          Copy-Item models/v6/* "$dir/models/v6"
          # Appearance themes are loaded at runtime by ThemeRegistry from themes\
          # next to the exe, so ship the directory too.
          Copy-Item themes $dir -Recurse
          Compress-Archive -Path $dir -DestinationPath "dist/FastPin-v$ver-x64.zip"
      # Build the installer on the runner so every released artifact is
      # reproducible from the tagged commit (a SignPath requirement).
      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-source-agreements --accept-package-agreements
      - name: Locate ISCC
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Add Simplified Chinese installer language
        run: |
          $lang = Join-Path (Split-Path $env:ISCC -Parent) "Languages\ChineseSimplified.isl"
          Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_3/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile $lang
      - name: Build installer
        run: |
          & $env:ISCC /DAppVersion=$env:APP_VERSION installer\fastpin.iss
      # The in-app updater refuses to execute an installer whose SHA-256 does
      # not match this manifest. Publish it from the same build so the hash
      # always describes the exact asset uploaded below.
      - name: Publish installer checksum
        run: |
          $ver = $env:APP_VERSION
          $asset = "FastPin-v$ver-x64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$asset").Hash.ToLowerInvariant()
          "$hash  $asset" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FastPin-v${{ env.APP_VERSION }}-x64.zip
            dist/FastPin-v${{ env.APP_VERSION }}-x64-setup.exe
            dist/SHA256SUMS.txt
