[workspace]
resolver = "2"
members = [
    "crates/fastpin",
    "crates/snow-memory",
    "crates/snow-stitch-images",
]

[workspace.package]
edition = "2021"
# Vendoring snow-shot's GPL-3.0-or-later crates makes the whole workspace a
# derivative work; FastPin is therefore relicensed to GPL-3.0-or-later.
license = "GPL-3.0-or-later"
version = "0.3.0"
# Match rust-toolchain.toml and ci.yml/release.yml so contributors and CI
# agree on the minimum compiler before a build even starts.
rust-version = "1.99.1"

# Shared dependency versions consumed by the vendored snow-* crates via
# `dep.workspace = true` (originally snow-crates' [workspace.dependencies]).
[workspace.dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
image = { version = "0.25.9", default-features = false, features = ["png"] }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3"
thiserror = "2.0.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
gpui-pre = { path = "third_party/gpui-pre" }
gpui-pre-windows = { path = "third_party/gpui-pre-windows" }
