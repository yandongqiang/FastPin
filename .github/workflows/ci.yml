name: ci
on: [push, pull_request]
jobs:
  x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      # ort-sys 的 build script 会把 DirectML.dll 写进 target/<profile>、
      # target/<profile>/examples 和 target/<profile>/deps。GitHub runner 没有
      # Developer Mode，无法建符号链接，fallback 到 fs::copy；若这些目录尚不
      # 存在，copy 报 "系统找不到指定的路径" (code 3) 并 panic。预先创建它们。
      - name: Prepare ort-sys dylib directories
        run: |
          foreach ($p in @('debug', 'release')) {
            foreach ($d in @('examples', 'deps')) {
              New-Item -ItemType Directory -Force "target/$p/$d" | Out-Null
            }
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
