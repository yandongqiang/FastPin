[package]
name = "snow-stitch-images"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version = "1.97.1"
description = "Clean-room Rust implementation workspace for stateful vertical screenshot stitching"
publish = false

[lib]
name = "snow_stitch_images"
path = "src/lib.rs"

[features]
perf-instrumentation = []
# Keep the default lean: FastPin depends on this crate with `default-features = false`,
# and workspace feature unification would otherwise force the heavy codecs on for
# everyone. Tests/examples opt in explicitly through the self dev-dependency below.
default = []
# Gates the developer-facing batch-stitch CLI so plain `cargo build` only
# produces the library consumed by the FFI wrapper. Build the CLI with:
# `cargo build --features cli --bin snow-stitch-images`
cli = []
full-image-io = [
    "image/avif",
    "image/bmp",
    "image/dds",
    "image/ff",
    "image/gif",
    "image/hdr",
    "image/ico",
    "image/jpeg",
    "image/pnm",
    "image/qoi",
    "image/rayon",
    "image/tga",
    "image/tiff",
    "image/webp",
]

# Vendored upstream code. Rust 1.99's `chunks_exact_to_as_chunks` fires across
# the crate; leaving the slices as written keeps this a faithful copy that is
# easy to diff against upstream.
[lints.clippy]
chunks_exact_to_as_chunks = "allow"

[dependencies]
snow-memory = { path = "../snow-memory" }
anyhow.workspace = true
image.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1.11.0"
tempfile.workspace = true
# Dev-dependencies only affect this package's own tests/examples, so the full
# codec set stays enabled for them without leaking into FastPin's dependency build.
snow-stitch-images = { path = ".", features = ["full-image-io"] }

[[bin]]
name = "snow-stitch-images"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "scroll_4_benchmark"
required-features = ["full-image-io"]

[[example]]
name = "memory_reference_benchmark"
required-features = ["perf-instrumentation"]

# Upstream ships these three memory benchmarks with a `#[path]` include of
# `benchmark-support/memory.rs`, which lives outside this crate and is not
# vendored here. Gate them so `cargo check --all-targets` stays usable; they
# build only when the benchmark harness is actually present.
[[example]]
name = "memory_paths_benchmark"
required-features = ["perf-instrumentation"]

[[example]]
name = "memory_snapshot_benchmark"
required-features = ["perf-instrumentation"]

[[example]]
name = "corpus_benchmark"
required-features = ["perf-instrumentation"]
